<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abhi Ludo</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

    <header class="topbar">
        <div>
            <div class="logo">ABHI<span>LUDO</span></div>
            <div class="subtitle">Classic • Fast • Fun</div>
        </div>

        <button id="soundBtn" class="icon-btn">🔊</button>
    </header>

    <main>

        <section class="game-info">

            <div class="player-card red-card active" id="redPlayer">
                <div class="player-avatar">R</div>
                <div>
                    <strong>Red</strong>
                    <small id="redStatus">Your Turn</small>
                </div>
            </div>

            <div class="turn-box">
                <span>TURN</span>
                <strong id="turnText">RED</strong>
            </div>

            <div class="player-card green-card" id="greenPlayer">
                <div class="player-avatar">G</div>
                <div>
                    <strong>Green</strong>
                    <small>Player 2</small>
                </div>
            </div>

        </section>

        <section class="board-wrapper">

            <div id="board" class="ludo-board">

                <!-- HOME AREAS -->

                <div class="home red-home">
                    <div class="home-inner">
                        <div class="token red-token" data-color="red" data-index="0"></div>
                        <div class="token red-token" data-color="red" data-index="1"></div>
                        <div class="token red-token" data-color="red" data-index="2"></div>
                        <div class="token red-token" data-color="red" data-index="3"></div>
                    </div>
                </div>

                <div class="home green-home">
                    <div class="home-inner">
                        <div class="token green-token" data-color="green" data-index="0"></div>
                        <div class="token green-token" data-color="green" data-index="1"></div>
                        <div class="token green-token" data-color="green" data-index="2"></div>
                        <div class="token green-token" data-color="green" data-index="3"></div>
                    </div>
                </div>

                <div class="home yellow-home">
                    <div class="home-inner">
                        <div class="token yellow-token" data-color="yellow" data-index="0"></div>
                        <div class="token yellow-token" data-color="yellow" data-index="1"></div>
                        <div class="token yellow-token" data-color="yellow" data-index="2"></div>
                        <div class="token yellow-token" data-color="yellow" data-index="3"></div>
                    </div>
                </div>

                <div class="home blue-home">
                    <div class="home-inner">
                        <div class="token blue-token" data-color="blue" data-index="0"></div>
                        <div class="token blue-token" data-color="blue" data-index="1"></div>
                        <div class="token blue-token" data-color="blue" data-index="2"></div>
                        <div class="token blue-token" data-color="blue" data-index="3"></div>
                    </div>
                </div>

                <!-- CENTER -->

                <div class="center-home">
                    <div class="triangle red-triangle"></div>
                    <div class="triangle green-triangle"></div>
                    <div class="triangle yellow-triangle"></div>
                    <div class="triangle blue-triangle"></div>
                </div>

                <!-- PATH CELLS -->

                <div class="path red-path"></div>
                <div class="path green-path"></div>
                <div class="path yellow-path"></div>
                <div class="path blue-path"></div>

                <div id="grid"></div>

            </div>

        </section>

        <section class="controls">

            <div class="dice-area">

                <div id="dice" class="dice">
                    <span id="diceNumber">6</span>
                </div>

                <button id="rollBtn" class="roll-btn">
                    ROLL DICE
                </button>

            </div>

            <div class="message" id="message">
                Roll the dice to start your turn
            </div>

        </section>

        <section class="bottom-panel">

            <div class="stat">
                <span>RED</span>
                <strong id="redScore">0</strong>
            </div>

            <div class="stat">
                <span>GREEN</span>
                <strong id="greenScore">0</strong>
            </div>

            <div class="stat">
                <span>YELLOW</span>
                <strong id="yellowScore">0</strong>
            </div>

            <div class="stat">
                <span>BLUE</span>
                <strong id="blueScore">0</strong>
            </div>

        </section>

        <button id="newGameBtn" class="new-game">
            ↻ NEW GAME
        </button>

    </main>

</div>

<div id="winnerModal" class="modal hidden">

    <div class="modal-card">

        <div class="winner-icon">🏆</div>

        <h2 id="winnerText">RED WINS!</h2>

        <p>Congratulations! You completed all tokens.</p>

        <button id="playAgain">
            PLAY AGAIN
        </button>

    </div>

</div>

<script src="game.js"></script>

</body>
              </html>
