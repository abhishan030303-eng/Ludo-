<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Abhi Ludo</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

<header>
    <div>
        <h1>ABHI<span>LUDO</span></h1>
        <p>Classic Ludo Game</p>
    </div>

    <button id="newGame">↻</button>
</header>

<div class="players">

    <div class="player red active" id="player-red">
        <div class="avatar">R</div>
        <div>
            <b>RED</b>
            <small>Player 1</small>
        </div>
    </div>

    <div class="turn">
        <small>TURN</small>
        <b id="turnName">RED</b>
    </div>

    <div class="player green" id="player-green">
        <div class="avatar">G</div>
        <div>
            <b>GREEN</b>
            <small>Player 2</small>
        </div>
    </div>

    <div class="player yellow" id="player-yellow">
        <div class="avatar">Y</div>
        <div>
            <b>YELLOW</b>
            <small>Player 3</small>
        </div>
    </div>

    <div class="player blue" id="player-blue">
        <div class="avatar">B</div>
        <div>
            <b>BLUE</b>
            <small>Player 4</small>
        </div>
    </div>

</div>

<main>

<div id="board" class="board">

    <!-- 15 x 15 board generated by JavaScript -->

    <div class="home-area red-home">
        <div class="home-title">RED</div>
        <div class="home-slots">
            <div class="slot"></div>
            <div class="slot"></div>
            <div class="slot"></div>
            <div class="slot"></div>
        </div>
    </div>

    <div class="home-area green-home">
        <div class="home-title">GREEN</div>
        <div class="home-slots">
            <div class="slot"></div>
            <div class="slot"></div>
            <div class="slot"></div>
            <div class="slot"></div>
        </div>
    </div>

    <div class="home-area yellow-home">
        <div class="home-title">YELLOW</div>
        <div class="home-slots">
            <div class="slot"></div>
            <div class="slot"></div>
            <div class="slot"></div>
            <div class="slot"></div>
        </div>
    </div>

    <div class="home-area blue-home">
        <div class="home-title">BLUE</div>
        <div class="home-slots">
            <div class="slot"></div>
            <div class="slot"></div>
            <div class="slot"></div>
            <div class="slot"></div>
        </div>
    </div>

    <div class="center"></div>

</div>

<div class="game-panel">

    <div class="dice-box">

        <div id="dice" class="dice">6</div>

        <button id="rollBtn">
            🎲 ROLL DICE
        </button>

    </div>

    <p id="message">
        RED's turn — Roll the dice
    </p>

</div>

</main>

<div class="scores">

    <div>
        <span>RED</span>
        <b id="score-red">0/4</b>
    </div>

    <div>
        <span>GREEN</span>
        <b id="score-green">0/4</b>
    </div>

    <div>
        <span>YELLOW</span>
        <b id="score-yellow">0/4</b>
    </div>

    <div>
        <span>BLUE</span>
        <b id="score-blue">0/4</b>
    </div>

</div>

</div>

<div id="winnerModal" class="modal hidden">

    <div class="modal-card">

        <div class="trophy">🏆</div>

        <h2 id="winnerTitle">RED WINS!</h2>

        <p>All four tokens reached home.</p>

        <button id="playAgain">
            PLAY AGAIN
        </button>

    </div>

</div>

<script src="game.js"></script>

</body>
</html>
